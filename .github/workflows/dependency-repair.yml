name: Dependency repair (temporary)

on:
  push:
    branches:
      - feat/nfc-identiv-dna
    paths:
      - package.json

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/nfc-identiv-dna
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile using npm
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts --audit-level=high
      - name: Install reproducibly
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): refresh lockfile and remediate npm audit"
            git push origin HEAD:feat/nfc-identiv-dna
          fi
